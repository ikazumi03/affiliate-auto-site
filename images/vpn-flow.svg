<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-label="VPNの仕組み図：あなたの端末から暗号化された経路を通り、VPNサーバーを経由して接続先サイトへアクセスする流れ">
  <rect x="0" y="0" width="960" height="300" fill="#f6fbfa"/>
  <text x="480" y="36" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#123c38">VPN接続の流れ（イメージ）</text>

  <!-- Device -->
  <rect x="30" y="90" width="180" height="110" rx="12" fill="#ffffff" stroke="#067d73" stroke-width="2"/>
  <text x="120" y="130" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#123c38">あなたの端末</text>
  <text x="120" y="158" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#53666b">スマホ・PCなど</text>
  <text x="120" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#53666b">カフェやホテルのWi-Fi</text>

  <!-- Arrow 1 -->
  <line x1="210" y1="145" x2="330" y2="145" stroke="#067d73" stroke-width="3"/>
  <polygon points="330,145 316,137 316,153" fill="#067d73"/>
  <rect x="222" y="96" width="120" height="30" rx="15" fill="#e9f6f3"/>
  <text x="282" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#067d73">暗号化して送信</text>

  <!-- VPN server -->
  <rect x="345" y="90" width="270" height="110" rx="12" fill="#067d73"/>
  <text x="480" y="130" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#ffffff">ExpressVPNのサーバー</text>
  <text x="480" y="158" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e9f6f3">世界113か国に設置（公式情報）</text>
  <text x="480" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#e9f6f3">ここで経路を中継します</text>

  <!-- Arrow 2 -->
  <line x1="615" y1="145" x2="735" y2="145" stroke="#067d73" stroke-width="3"/>
  <polygon points="735,145 721,137 721,153" fill="#067d73"/>
  <rect x="627" y="96" width="120" height="30" rx="15" fill="#e9f6f3"/>
  <text x="687" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#067d73">中継して接続</text>

  <!-- Destination -->
  <rect x="750" y="90" width="180" height="110" rx="12" fill="#ffffff" stroke="#067d73" stroke-width="2"/>
  <text x="840" y="130" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#123c38">接続先のサイト</text>
  <text x="840" y="158" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#53666b">Webサイトやアプリ</text>
  <text x="840" y="180" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#53666b">動画・SNS・仕事用ツール</text>

  <text x="480" y="248" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#123c38">接続先からは、あなたの端末ではなくVPNサーバー側のIPアドレスが見えます。</text>
  <text x="480" y="274" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#53666b">※仕組みを分かりやすく示した当サイトの自作図です。VPNだけでウイルスや詐欺を防げるわけではありません。</text>
</svg>
