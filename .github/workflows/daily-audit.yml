name: Daily Affiliate Site Audit

on:
  schedule:
    - cron: '17 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run site checks
        run: python ops/check_site.py --site-url "https://affiliate-auto-site-1tk.pages.dev"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-${{ github.run_number }}
          path: reports/latest.*
          retention-days: 30
