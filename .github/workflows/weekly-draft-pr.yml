name: Weekly Draft Article Pull Request

# 安全修正: 未検証の固定本文による自動生成・PR作成は停止中。
# 公式出典の検証と承認済み広告台帳を実装した別PRの承認後に再開する。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Draft readiness only (no article, commit, push or PR)
        run: |
          python ops/generate_draft.py
          cat reports/draft_readiness.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: draft-readiness-${{ github.run_number }}
          path: reports/draft_readiness.*
          retention-days: 14
