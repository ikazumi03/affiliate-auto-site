name: Weekly Affiliate Site Audit & Report

on:
  schedule:
    # 月曜日 09:17 JST。GitHub側の遅延で時刻がずれる場合があります。
    - cron: '17 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-site-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only site audit (no sitemap changes or production commits)
        run: python ops/check_site.py --site-url "https://affiliate-auto-site-1tk.pages.dev"
      - name: Add report to Step Summary
        if: always()
        run: |
          if [ -f reports/latest.md ]; then
            cat reports/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create or update weekly report Issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('reports/latest.md', 'utf8');
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const label = 'weekly-audit';
            try {
              await github.rest.issues.getLabel({...repo, name: label});
            } catch (e) {
              if (e.status !== 404) throw e;
              try {
                await github.rest.issues.createLabel({...repo, name: label, color: '0e8a16'});
              } catch (createError) {
                if (createError.status !== 422) throw createError;
              }
            }
            const issues = await github.paginate(github.rest.issues.listForRepo,
              {...repo, state: 'open', labels: label, per_page: 100});
            const report = issues.find(i => !i.pull_request && i.user.login === 'github-actions[bot]');
            if (report) {
              await github.rest.issues.createComment({...repo, issue_number: report.number, body});
            } else {
              const day = new Date().toLocaleDateString('sv-SE', {timeZone: 'Asia/Tokyo'});
              await github.rest.issues.create({...repo,
                title: `【週次運用レポート】サイト自動点検結果 (${day})`, body, labels: [label]});
            }
      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-${{ github.run_number }}
          path: reports/latest.*
          retention-days: 30
      - name: Fail check when technical issues were detected
        if: success()
        run: |
          python -c 'import json, sys; r=json.load(open("reports/latest.json")); sys.exit(1 if r["issues"] else 0)'
