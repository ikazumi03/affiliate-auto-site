name: Weekly Affiliate Site Audit & Report

on:
  schedule:
    # 毎週月曜日 09:00 JST (00:00 UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run site audit and update sitemap
        run: |
          python ops/check_site.py --site-url "https://affiliate-auto-site-1tk.pages.dev"

      - name: Add report to Step Summary
        run: |
          cat reports/latest.md >> $GITHUB_STEP_SUMMARY

      - name: Create or update GitHub Issue with weekly report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportContent = fs.readFileSync('reports/latest.md', 'utf8');
            const today = new Date().toISOString().split('T')[0];
            const issueTitle = `【週次運用レポート】サイト自動点検結果 (${today})`;
            
            // 既存の未解決点検Issueを探す（重複防止）
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['weekly-audit']
            });

            if (issues.data.length > 0) {
              // 既存Issueにコメントを追加
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues.data[0].number,
                body: reportContent
              });
              console.log(`Updated existing issue #${issues.data[0].number}`);
            } else {
              // 新規Issueを作成
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: reportContent,
                labels: ['weekly-audit']
              });
              console.log('Created new audit issue');
            }

      - name: Commit updated sitemap if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add sitemap.xml reports/latest.md reports/latest.json || true
          if git diff --staged --quiet; then
            echo "No changes in sitemap or reports."
          else
            git commit -m "Auto-update sitemap and latest reports [skip ci]"
            git push
          fi

      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-${{ github.run_number }}
          path: reports/latest.*
          retention-days: 30
